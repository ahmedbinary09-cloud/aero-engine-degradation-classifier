app = "rul-health-monitor"        # must be unique on Fly.io - change it
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 9696
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
